services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: judicialsync
      POSTGRES_PASSWORD: judicialsync_dev
      POSTGRES_DB: judicialsync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judicialsync -d judicialsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://judicialsync:judicialsync_dev@db:5432/judicialsync

volumes:
  pgdata:
